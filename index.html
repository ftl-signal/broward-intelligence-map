<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THE FLORIDA SIGNAL | Premium Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0f172a; --bg-panel: #1e293b; --bg-card: #334155;
    --text-main: #f8fafc; --text-muted: #94a3b8;
    --c-land: #A855F7;  
    --c-appr: #F59E0B;  
    --c-pre:  #3B82F6;  
    --c-und:  #10B981;  
    --c-cap:  #F43F5E;  
    --brand-blue: #38bdf8;
    --urgent-glow: 0 0 10px rgba(56, 189, 248, 0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body, html { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main); }

  .layout { display: flex; height: 100vh; width: 100vw; position: relative; }
  .mobile-handle { display: none; }

  .sidebar { width: 400px; background: var(--bg-dark); border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; z-index: 1000; box-shadow: 4px 0 15px rgba(0,0,0,0.5); }
  .header { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; margin-bottom: 8px; }
  .logo { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #fff; }
  .sub-logo { font-size: 11px; font-weight: 600; color: var(--brand-blue); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .sub-logo::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--brand-blue); border-radius: 50%; }

  /* Premium Paywall Badge */
  .paywall-badge {
    margin-top: 14px;
    display: inline-flex;
    align-items: center;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: var(--brand-blue);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stats-main { margin-top: 24px; padding: 16px; background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 8px; border-left: 3px solid var(--brand-blue); }
  .stat-val-main { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
  .stat-lbl-main { font-size: 11px; font-weight: 600; color: var(--brand-blue); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .sidebar-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }
  .filters { padding: 0 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); background: transparent; flex-shrink: 0; }
  
  .search-box { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 12px; outline: none; margin-bottom: 20px; transition: border-color 0.2s; }
  .search-box:focus { border-color: var(--brand-blue); }
  .search-box::placeholder { color: var(--text-muted); }

  .filter-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; display: block; }
  .cat-filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .cat-btn { display: flex; align-items: center; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; text-align: left; }
  .cat-btn:hover { background: rgba(255,255,255,0.05); }
  .cat-btn.active { color: #fff; border-color: currentColor; background: rgba(255,255,255,0.05); }
  .cat-indicator { width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; }

  .val-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .val-btn { flex: 1; min-width: 60px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 6px 0; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; text-align: center; }
  .val-btn.active { background: var(--brand-blue); color: #0f172a; border-color: var(--brand-blue); }

  .list-header { padding: 20px 20px 12px; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .list-container { flex: 1; padding: 0; }
  .list-item { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
  .list-item:hover { background: rgba(255,255,255,0.02); border-left-color: rgba(255,255,255,0.2); }
  .li-name { font-size: 13px; font-weight: 700; color: #cbd5e1; margin-bottom: 4px; }
  .li-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .li-val { font-weight: 700; color: #64748b; }

  .map-container { flex: 1; position: relative; height: 100%; background: #0b0f19; z-index: 1; }
  #map { width: 100%; height: 100%; }
  .leaflet-tile-pane { filter: brightness(1.8) contrast(1.1) saturate(1.2); } 

  .map-branding {
    position: absolute; top: 24px; left: 60px; z-index: 3001;
    background: rgba(11, 15, 25, 0.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.4); padding: 14px 20px; border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 1px 1px rgba(56, 189, 248, 0.2); 
    pointer-events: auto; text-decoration: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .map-branding:hover { transform: translateY(-2px); }
  .map-branding img { height: 44px; width: auto; margin-bottom: 6px; } 
  .map-branding .brand-tagline { 
    font-size: 13px; font-weight: 800; color: var(--brand-blue); text-transform: uppercase; 
    letter-spacing: 1.5px; text-shadow: var(--urgent-glow);
    animation: live-pulse 2s infinite ease-in-out; text-align: center; width: 100%;
  }

  @keyframes live-pulse {
    0%, 100% { opacity: 1; text-shadow: var(--urgent-glow); }
    50% { opacity: 0.8; text-shadow: 0 0 3px rgba(56, 189, 248, 0.3); }
  }

  .map-cue {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(56, 189, 248, 0.5); color: #ffffff; padding: 12px 22px; border-radius: 30px; 
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px; z-index: 1000; pointer-events: none; 
    transition: opacity 0.4s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.4); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .map-cue.fade-out { opacity: 0; }

  .filters-cta {
    position: absolute; bottom: 32px; right: 32px; z-index: 1000;
    text-decoration: none; display: flex; align-items: center; gap: 8px;
    background: rgba(11, 15, 25, 0.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--brand-blue); color: var(--text-main);
    padding: 16px 26px; border-radius: 8px; font-size: 14px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 15px rgba(56, 189, 248, 0.2);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .filters-cta:hover { background: var(--brand-blue); color: #000000; transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 20px rgba(56, 189, 248, 0.5); }

  .custom-marker { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: transparent; cursor: pointer; }
  .marker-core { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.5); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .custom-marker:hover .marker-core, .marker-core.hover-active { transform: scale(1.6); border-color: #fff; box-shadow: 0 0 12px #fff, 0 0 4px rgba(0,0,0,0.8); }

  .leaflet-popup-content-wrapper { background: var(--bg-panel); color: var(--text-main); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.6); padding: 0; overflow: hidden; }
  .leaflet-popup-tip { background: var(--bg-panel); }
  .leaflet-popup-content { margin: 0; width: 300px !important; }
  
  .pop-header { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .pop-title { font-size: 15px; font-weight: 800; color: #fff; line-height: 1.3; margin-bottom: 10px; }
  .pop-badge { display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; color: #000; letter-spacing: 0.5px;}
  
  .pop-body { padding: 16px; font-size: 12px; max-height: 400px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .pop-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .pop-lbl { color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; width: 30%;}
  .pop-val { font-weight: 700; text-align: right; width: 70%; color: #f8fafc; }
  .pop-val.highlight { color: #10B981; }
  
  .pop-summary { margin-top: 12px; color: #cbd5e1; line-height: 1.5; font-size: 12px; }
  .pop-takeaway { margin-top: 12px; padding: 10px; background: rgba(0,0,0,0.2); border-left: 2px solid var(--brand-blue); border-radius: 0 4px 4px 0; color: var(--brand-blue); font-weight: 600; line-height: 1.4; font-size: 12px; }
  
  .pop-optional { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
  .pop-opt-row { display: flex; justify-content: space-between; align-items: flex-start; font-size: 10px; margin-bottom: 4px; }
  .pop-opt-lbl { color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; width: 35%; }
  .pop-opt-val { color: var(--text-muted); text-align: right; width: 65%; font-weight: 500; }

  .pop-actions { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.05); }
  .pop-btn-primary { display: block; background: transparent; border: 1px solid var(--brand-blue); color: var(--brand-blue); padding: 10px 16px; border-radius: 4px; font-size: 12px; font-weight: 800; text-decoration: none; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; text-align: center; margin-bottom: 8px; }
  .pop-btn-primary:hover { background: var(--brand-blue); color: #0f172a; }
  
  .pop-btn-secondary { display: block; width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-muted); padding: 10px 16px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; text-align: center; cursor: pointer; margin-top: 8px; }
  .pop-btn-secondary:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.4); }

  .pop-sources { font-size: 10px; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px; }
  .pop-sources a { color: var(--text-muted); text-decoration: underline; margin-left: 4px; transition: color 0.2s; }
  .pop-sources a:hover { color: #fff; }

  @media(max-width: 800px) {
    .layout { display: block; height: 100dvh; }
    .map-container { height: 100dvh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; }
    .leaflet-tile-pane { filter: brightness(2.0) contrast(1.1) saturate(1.2); } 

    .map-branding { top: 12px; left: 16px; padding: 10px 14px; }
    .map-branding img { height: 32px; margin-bottom: 2px;} 
    .map-branding .brand-tagline { font-size: 11px; }

    .filters-cta { bottom: 85px; right: 16px; padding: 12px 18px; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    .map-cue { top: 90px; font-size: 12px; padding: 8px 16px; }

    .sidebar { 
      position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; 
      background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.1); border-right: none; border-radius: 16px 16px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.4); transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden; z-index: 2000;
    }
    .sidebar.expanded { height: 75dvh; }
    .sidebar:not(.expanded) .header, .sidebar:not(.expanded) .sidebar-scroll { display: none; }
    .sidebar-scroll { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px); overscroll-behavior: contain; }

    .mobile-handle { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60px; background: transparent; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; flex-shrink: 0; width: 100%; }
    .sidebar.expanded .mobile-handle { border-bottom: none; } 
    .handle-bar { width: 36px; height: 4px; background: rgba(255,255,255,0.4); border-radius: 2px; margin-bottom: 6px; }
    .handle-lbl { font-size: 13px; font-weight: 600; color: #ffffff; letter-spacing: 0.3px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); } 

    .cat-btn { padding: 12px 16px; font-size: 13px; }
    .val-btn { padding: 12px 0; font-size: 12px; }
    .search-box { padding: 14px; font-size: 16px; }

    .leaflet-popup-content { width: 320px !important; max-width: 85vw !important; }
    .pop-body { max-height: 40dvh; } 
    .pop-title { font-size: 15px; }
    .pop-body { font-size: 13px; }
  }

  @media (max-width: 800px) and (orientation: landscape) {
    .sidebar.expanded { height: 85dvh; }
    .pop-body { max-height: 45dvh; }
  }

  /* HOMEPAGE EMBED CLASSES */
  body.is-preview .sidebar,
  body.is-preview .map-cue,
  body.is-preview .map-branding,
  body.is-preview .filters-cta,
  body.is-preview .leaflet-control-container { display: none !important; }
  body.is-preview .leaflet-tile-pane { filter: brightness(2.2) contrast(1.05) saturate(1.2) !important; }

  .preview-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000; display: flex; justify-content: center; align-items: center; text-decoration: none; background: rgba(15, 23, 42, 0.15); cursor: pointer; }
  .cta-button { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(56, 189, 248, 0.6); color: #ffffff; padding: 16px 32px; border-radius: 40px; font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 8px 25px rgba(0,0,0,0.5); animation: pulse-glow 2.5s infinite; }
  
  @keyframes pulse-glow {
    0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4), 0 8px 25px rgba(0,0,0,0.5); }
    70% { box-shadow: 0 0 0 15px rgba(56, 189, 248, 0), 0 8px 25px rgba(0,0,0,0.5); }
    100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0), 0 8px 25px rgba(0,0,0,0.5); }
  }

  body.is-preview { display: flex; align-items: center; justify-content: center; background-color: var(--bg-dark); padding: 20px; }
  body.is-preview .layout { max-width: 1100px; width: 100%; height: auto; aspect-ratio: 16 / 9; margin: 0 auto; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); overflow: hidden; }
  body.is-preview .map-container { position: relative !important; width: 100% !important; height: 100% !important; }
  @media (max-width: 800px) { body.is-preview { padding: 10px; } body.is-preview .layout { aspect-ratio: 4 / 5; height: auto !important; } }
</style>
</head>
<body>

<div class="layout">
  <a href="#" id="preview-overlay" class="preview-overlay" target="_top" style="display: none;">
    <div class="cta-button">Explore Live Signals</div>
  </a>

  <aside class="sidebar" id="sidebar">
    <div class="mobile-handle" id="mobile-toggle">
      <div class="handle-bar"></div>
      <span class="handle-lbl" id="mobile-toggle-lbl">Tap to view signals</span>
    </div>

    <div class="header">
      <div class="logo">The Florida Signal</div>
      <div class="sub-logo">Terminal Access | Broward County</div>
      
      <div class="paywall-badge">🔒 FOUNDING MEMBER EXCLUSIVE — $49/mo</div>
      
      <div class="stats-main">
        <div class="stat-val-main"><span id="stat-count">0</span> ACTIVE SIGNALS</div>
        <div class="stat-lbl-main">Tracked across Broward County</div>
      </div>
    </div>

    <div class="sidebar-scroll">
      <div class="filters">
        <input type="text" id="search-box" class="search-box" placeholder="Search projects, developers, or addresses...">
        <span class="filter-lbl">Category Selection</span>
        <div class="cat-filters" id="cat-filters"></div>
        <span class="filter-lbl" style="margin-top:16px;">Minimum Value</span>
        <div class="val-filters">
          <button class="val-btn active" data-val="0">All</button>
          <button class="val-btn" data-val="10000000">$10M+</button>
          <button class="val-btn" data-val="20000000">$20M+</button>
          <button class="val-btn" data-val="30000000">$30M+</button>
        </div>
      </div>
      <div class="list-header">LEAD SIGNALS RIGHT NOW</div>
      <div class="list-container" id="signal-list"></div>
    </div>
  </aside>
  
  <div class="map-container">
    <a href="https://thefloridasignalbrief.ghost.io/" target="_blank" class="map-branding">
      <img src="logo-compact.png" alt="The Florida Signal" onerror="this.style.display='none'">
      <div class="brand-tagline">LIVE SIGNALS</div>
    </a>
    
    <div class="map-cue" id="map-cue">Tap to explore signals</div>
    
    <a href="https://thefloridasignalbrief.ghost.io/" target="_blank" class="filters-cta" id="global-cta">See More Signals &rarr;</a>
    <div id="map"></div>
  </div>
</div>

<script>
// ==========================================
// 1. MAP EMBED / PREVIEW LOGIC
// ==========================================
let isEmbedded = false;
try { if (window.location.search.includes('preview=true')) isEmbedded = true; } catch (e) {}

if (isEmbedded) {
    document.body.classList.add('is-preview');
    const overlay = document.getElementById('preview-overlay');
    if (overlay) {
        overlay.style.display = 'flex';
        try { overlay.href = window.location.href.split('?')[0]; } catch(e) {}
    }
}

window.resetMapView = function(e) {
    if(e) e.stopPropagation();
    if(map) {
        map.closePopup();
        map.flyTo([26.15, -80.14], 11, { duration: 0.8 });
    }
};

// ==========================================
// 2. DATA MODEL INIT
// ==========================================
const CAT_COLORS = {
  "Land in Play": "#A855F7",
  "In Approvals": "#F59E0B",
  "Pre-Construction": "#3B82F6",
  "Under Construction": "#10B981",
  "Capital Repositioning": "#F43F5E"
};

const CATEGORIES = Object.keys(CAT_COLORS);
let activeCategories = new Set(CATEGORIES);
let minValFilter = 0; 
let markers = {}; 
let signals = [];

const mapOptions = {
  zoomControl: false, 
  attributionControl: false,
  dragging: !isEmbedded,
  scrollWheelZoom: !isEmbedded,
  doubleClickZoom: !isEmbedded,
  boxZoom: !isEmbedded,
  touchZoom: !isEmbedded,
  keyboard: !isEmbedded
};

const map = L.map('map', mapOptions).setView([26.15, -80.14], 11);
if (!isEmbedded) {
  L.control.zoom({ position: 'topright' }).addTo(map);
}

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19
}).addTo(map);

const sidebar = document.getElementById('sidebar');
const mobileToggle = document.getElementById('mobile-toggle');
const mobileToggleLbl = document.getElementById('mobile-toggle-lbl');

mobileToggle.addEventListener('click', () => {
  sidebar.classList.toggle('expanded');
  const isExpanded = sidebar.classList.contains('expanded');
  
  if(isExpanded) {
    mobileToggleLbl.innerText = "Tap to close panel";
    map.dragging.disable(); map.scrollWheelZoom.disable();
    if(map.touchZoom) map.touchZoom.disable();
    if(map.doubleClickZoom) map.doubleClickZoom.disable();
    if(map.boxZoom) map.boxZoom.disable();
    if(map.keyboard) map.keyboard.disable();
  } else {
    updateMobileHandleLabel();
    if(!isEmbedded) {
      map.dragging.enable(); map.scrollWheelZoom.enable();
      if(map.touchZoom) map.touchZoom.enable();
      if(map.doubleClickZoom) map.doubleClickZoom.enable();
      if(map.boxZoom) map.boxZoom.enable();
      if(map.keyboard) map.keyboard.enable();
    }
  }
  setTimeout(() => map.invalidateSize(), 320);
});

function updateMobileHandleLabel() {
  if(!sidebar.classList.contains('expanded')) {
    const visibleCount = document.getElementById('stat-count').innerText;
    mobileToggleLbl.innerText = `Tap to view ${visibleCount} signals`;
  }
}

document.getElementById('search-box').addEventListener('input', applyFilters);

function getEffectiveValue(signal) {
  if (signal.declared_value !== null && signal.declared_value !== undefined) return signal.declared_value;
  if (signal.estimated_value !== null && signal.estimated_value !== undefined) return signal.estimated_value;
  return null;
}

function initMap() {
  document.getElementById('stat-total').innerText = signals.length;
  
  const cue = document.getElementById('map-cue');
  if (cue) cue.innerText = `Tap to explore ${signals.length} active signals`;
  const hideCue = () => { if (cue) cue.classList.add('fade-out'); };
  
  if (!isEmbedded) {
    map.once('dragstart', hideCue);
    map.once('click', hideCue);
    map.once('zoomstart', hideCue);
  }

  buildCategoryFilters();
  setupValueFilters();
  
  const triggerPinView = (s, mk) => {
    const isMobile = window.innerWidth <= 800;
    const targetZoom = isMobile ? 12 : 13;
    const latOffset = isMobile ? 0.035 : 0.012; 
    map.flyTo([s.latitude + latOffset, s.longitude], targetZoom, { duration: 0.5 });
    if(mk) {
        setTimeout(() => { mk.openPopup(); }, 550);
    }
  };

  signals.forEach(s => {
    if (s.map_live === false) return;

    const color = CAT_COLORS[s.category] || "#94a3b8";
    const icon = L.divIcon({
      className: 'custom-marker',
      html: `<div class="marker-core" style="background-color: ${color}; border-color: ${color};"></div>`,
      iconSize: [44, 44], 
      iconAnchor: [22, 22]
    });

    const mk = L.marker([s.latitude, s.longitude], { icon: icon }).addTo(map);
    
    if (!isEmbedded) {
      let bodyHtml = '';
      if(s.address || s.city) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Address</span><span class="pop-val">${s.address || ''}, ${s.city || ''}</span></div>`;
      if (s.permit_number) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Permit #</span><span class="pop-val" style="font-family:var(--mono); font-size:10px">${s.permit_number}</span></div>`;
      if (s.filed_date) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Filed</span><span class="pop-val">${s.filed_date}</span></div>`;
      if (s.value_label) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Value</span><span class="pop-val highlight">${s.value_label}</span></div>`;
      
      if (s.owner || s.applicant) {
          let entity = s.owner || s.applicant;
          if (s.owner && s.applicant) entity = `${s.owner} / ${s.applicant}`;
          bodyHtml += `<div class="pop-row"><span class="pop-lbl">Entity</span><span class="pop-val">${entity}</span></div>`;
      }

      if (s.summary) bodyHtml += `<div class="pop-summary" style="margin-top:16px;"><strong>What we found:</strong> ${s.summary}</div>`;
      if (s.why_it_matters) bodyHtml += `<div class="pop-takeaway" style="margin-top:12px;"><strong>Why it matters:</strong> ${s.why_it_matters}</div>`;
      if (s.what_next) bodyHtml += `<div class="pop-summary" style="margin-top:12px;"><strong>What's next:</strong> ${s.what_next}</div>`;
      if (s.what_we_dont_know) bodyHtml += `<div class="pop-summary" style="margin-top:12px; color:var(--c-cap)"><strong>Caution:</strong> ${s.what_we_dont_know}</div>`;

      let optionalFields = '';
      let hasOptionals = s.key_players || s.scale || s.timeline || s.contractor || s.parcel_id;
      if (hasOptionals) {
        optionalFields = `<div class="pop-optional">`;
        if (s.key_players) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Players</span><span class="pop-opt-val">${s.key_players}</span></div>`;
        if (s.contractor) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Contractor</span><span class="pop-opt-val">${s.contractor}</span></div>`;
        if (s.scale) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Scale</span><span class="pop-opt-val">${s.scale}</span></div>`;
        if (s.timeline) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Timeline</span><span class="pop-opt-val">${s.timeline}</span></div>`;
        if (s.parcel_id) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Parcel ID</span><span class="pop-opt-val" style="font-family:var(--mono); font-size:9px">${s.parcel_id}</span></div>`;
        optionalFields += `</div>`;
      }

      let actionLinksHtml = '';
      let sourcesHtml = '';
      if (s.source_links) {
          if (s.source_links.web_story) {
              actionLinksHtml += `<a href="${s.source_links.web_story}" target="_blank" class="pop-btn-primary">Read full brief &rarr;</a>`;
          }
          let secondaryLinks = [];
          if (s.source_links.permit) secondaryLinks.push(`<a href="${s.source_links.permit}" target="_blank">Permit</a>`);
          if (s.source_links.appraiser) secondaryLinks.push(`<a href="${s.source_links.appraiser}" target="_blank">Appraiser</a>`);
          if (s.source_links.gis) secondaryLinks.push(`<a href="${s.source_links.gis}" target="_blank">GIS</a>`);
          if (s.source_links.agenda) secondaryLinks.push(`<a href="${s.source_links.agenda}" target="_blank">Agenda</a>`);
          
          if (secondaryLinks.length > 0) sourcesHtml = `<div class="pop-sources" style="margin-bottom:12px;"><strong>Sources:</strong> ${secondaryLinks.join(' | ')}</div>`;
      }

      actionLinksHtml += `<button class="pop-btn-secondary" onclick="resetMapView(event)">Reset Map View ↺</button>`;
      let finalActions = `<div class="pop-actions">${sourcesHtml}${actionLinksHtml}</div>`;

      mk.bindPopup(`
        <div class="pop-header" style="border-top: 4px solid ${color}">
          <div class="pop-title">${s.project_name}</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <div class="pop-badge" style="background-color: ${color}33; color: ${color}; border: 1px solid ${color}66;">${s.category}</div>
            <div class="pop-badge" style="background-color: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.2);">STATUS: ${s.status_label.toUpperCase()}</div>
            <div class="pop-badge" style="background-color: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1);">SIG: ${s.signal_strength.toUpperCase()}</div>
          </div>
        </div>
        <div class="pop-body">
          ${bodyHtml}
          ${optionalFields}
          ${finalActions}
        </div>
      `, { autoPan: false });

      mk.on('click', () => {
        triggerPinView(s, mk);
        hideCue();
      });
    }
    markers[s.id] = { data: s, layer: mk };
  });

  applyFilters();
  window.triggerPinView = triggerPinView;
}

function buildCategoryFilters() {
  const container = document.getElementById('cat-filters');
  CATEGORIES.forEach(cat => {
    const color = CAT_COLORS[cat];
    const btn = document.createElement('button');
    btn.className = 'cat-btn active';
    btn.innerHTML = `<div class="cat-indicator" style="background-color: ${color}; box-shadow: 0 0 4px ${color};"></div> ${cat}`;
    btn.onclick = () => {
      if (activeCategories.has(cat)) {
        activeCategories.delete(cat);
        btn.classList.remove('active');
        btn.querySelector('.cat-indicator').style.opacity = '0.2';
      } else {
        activeCategories.add(cat);
        btn.classList.add('active');
        btn.querySelector('.cat-indicator').style.opacity = '1';
      }
      applyFilters();
    };
    container.appendChild(btn);
  });
}

function setupValueFilters() {
  const btns = document.querySelectorAll('.val-btn');
  btns.forEach(btn => {
    btn.onclick = () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      minValFilter = parseInt(btn.getAttribute('data-val'));
      applyFilters();
    };
  });
}

function formatMoney(num) {
  if (num === 0) return '$0';
  if (num >= 1000000000) return '$' + (num / 1000000000).toFixed(1) + 'B';
  if (num >= 1000000) return '$' + (num / 1000000).toFixed(1) + 'M';
  if (num >= 1000) return '$' + (num / 1000).toFixed(0) + 'K';
  return '$' + num;
}

function applyFilters() {
  let activeCount = 0;
  let totalValue = 0;
  const listContainer = document.getElementById('signal-list');
  listContainer.innerHTML = '';
  
  const searchTerm = document.getElementById('search-box').value.toLowerCase();
  
  const isFiltered = activeCategories.size !== CATEGORIES.length || minValFilter > 0 || searchTerm.length > 0;
  const filterStatusEl = document.getElementById('filter-status');
  if (isFiltered) {
    filterStatusEl.innerText = "Filtered View";
    filterStatusEl.classList.add("active-filter");
  } else {
    filterStatusEl.innerText = "All Signals";
    filterStatusEl.classList.remove("active-filter");
  }

  Object.values(markers).forEach(item => {
    const s = item.data;
    const mk = item.layer;
    
    if (s.map_live === false) return; 

    const val = getEffectiveValue(s) || 0;
    const catMatch = activeCategories.has(s.category);
    const valMatch = val >= minValFilter;
    
    const searchString = `${s.project_name} ${s.address} ${s.city} ${s.key_players || ''} ${s.owner || ''} ${s.permit_number || ''}`.toLowerCase();
    const searchMatch = searchString.includes(searchTerm);

    if (catMatch && valMatch && searchMatch) {
      if (!map.hasLayer(mk)) mk.addTo(map);
      activeCount++;
      totalValue += val;

      const d = document.createElement('div');
      d.className = 'list-item';
      d.style.borderLeftColor = CAT_COLORS[s.category] || '#94a3b8';
      const isUndisclosed = s.value_label === 'Undisclosed' || s.value_label.includes('Est');
      
      d.innerHTML = `
        <div class="li-name">${s.project_name}</div>
        <div class="li-meta">
          <span>${s.category} | ${s.status_label.toUpperCase()}</span>
          <span class="li-val" style="color: ${isUndisclosed ? 'var(--text-muted)' : '#cbd5e1'}">${s.value_label}</span>
        </div>
      `;
      
      if (!isEmbedded) {
        d.onclick = () => {
          window.triggerPinView(s, mk);
          
          if(window.innerWidth <= 800 && sidebar.classList.contains('expanded')) {
            sidebar.classList.remove('expanded');
            updateMobileHandleLabel();
            map.dragging.enable();
            map.scrollWheelZoom.enable();
            if(map.touchZoom) map.touchZoom.enable();
            if(map.doubleClickZoom) map.doubleClickZoom.enable();
            if(map.boxZoom) map.boxZoom.enable();
            if(map.keyboard) map.keyboard.enable();
            
            const globalCta = document.getElementById('global-cta');
            if(globalCta) globalCta.style.opacity = '1';
            
            setTimeout(() => map.invalidateSize(), 320);
          }
        };
      }
      
      d.onmouseenter = () => { const iconEl = mk.getElement(); if(iconEl) { const core = iconEl.querySelector('.marker-core'); if(core) core.classList.add('hover-active'); } };
      d.onmouseleave = () => { const iconEl = mk.getElement(); if(iconEl) { const core = iconEl.querySelector('.marker-core'); if(core) core.classList.remove('hover-active'); } };
      
      listContainer.appendChild(d);
    } else {
      if (map.hasLayer(mk)) map.removeLayer(mk);
    }
  });

  if(window.innerWidth <= 800) {
      const globalCta = document.getElementById('global-cta');
      if (globalCta) {
          if(sidebar.classList.contains('expanded')) {
              globalCta.style.opacity = '0';
              globalCta.style.pointerEvents = 'none';
          } else {
              globalCta.style.opacity = '1';
              globalCta.style.pointerEvents = 'auto';
          }
      }
  }

  document.getElementById('stat-count').innerText = activeCount;
  document.getElementById('stat-val').innerText = formatMoney(totalValue);
  updateMobileHandleLabel();
}

// ==========================================
// 3. ASYNC DATA FETCH & INITIALIZATION
// ==========================================
async function loadSignalsAndInitMap() {
    try {
        const response = await fetch('data/signals.json');
        if (!response.ok) throw new Error('Failed to load signals JSON.');
        signals = await response.json();
        
        // Apply coordinate jitter once data is loaded
        const coordMap = new Set();
        signals.forEach(s => {
            let coordKey = `${s.latitude},${s.longitude}`;
            while (coordMap.has(coordKey)) {
                s.latitude += (Math.random() - 0.5) * 0.001;
                s.longitude += (Math.random() - 0.5) * 0.001;
                coordKey = `${s.latitude},${s.longitude}`;
            }
            coordMap.add(coordKey);
        });

        initMap();
    } catch (error) {
        console.error("Error initializing map data:", error);
    }
}

setTimeout(() => { 
    map.invalidateSize(); 
    loadSignalsAndInitMap(); 
}, 200);

</script>
