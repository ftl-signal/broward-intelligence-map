<style>

    --bg-dark: #0f172a; --bg-panel: #1e293b; --bg-card: #334155;
    --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
    
    /* Premium Category Colors */
    --c-land: #A855F7;  /* Purple: Land in Play */
    --c-appr: #F59E0B;  /* Orange: In Approvals */
    --c-pre:  #3B82F6;  /* Blue: Pre-Construction */
    --c-und:  #10B981;  /* Green: Under Construction */
    --c-cap:  #F43F5E;  /* Red: Capital Repositioning */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body, html { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main); }

  .layout { display: flex; height: 100vh; width: 100vw; }

  /* Mobile Handle (Hidden on Desktop) */
  .mobile-handle { display: none; }

  /* Sidebar */
  .sidebar { width: 400px; background: var(--bg-dark); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; box-shadow: 4px 0 15px rgba(0,0,0,0.5); }
  .header { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #fff; }
  .sub-logo { font-size: 11px; font-weight: 600; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .sub-logo::before { content: ''; display: inline-block; width: 6px; height: 6px; background: #38bdf8; border-radius: 50%; }

  /* Stats Section */
  .filter-status { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 18px; margin-bottom: -8px; color: var(--text-muted); transition: color 0.2s; }
  .filter-status.active-filter { color: #38bdf8; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat-box { background: var(--bg-panel); padding: 12px; border-radius: 6px; border: 1px solid var(--border); }
  .stat-val { font-size: 20px; font-weight: 800; color: #fff; }
  .stat-lbl { font-size: 10px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); margin-top: 4px; line-height: 1.3; }

  .filters { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--bg-panel); flex-shrink: 0; }
  
  /* Search Bar */
  .search-box { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 12px; outline: none; margin-bottom: 16px; transition: border-color 0.2s; }
  .search-box:focus { border-color: #38bdf8; }
  .search-box::placeholder { color: var(--text-muted); }

  .filter-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; display: block; }
  .cat-filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .cat-btn { display: flex; align-items: center; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; text-align: left; }
  .cat-btn:hover { background: var(--bg-card); }
  .cat-btn.active { color: #fff; border-color: currentColor; background: rgba(255,255,255,0.05); }
  .cat-indicator { width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; }

  .val-filters { display: flex; gap: 6px; }
  .val-btn { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 0; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; text-align: center; }
  .val-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

  .list-container { flex: 1; overflow-y: auto; padding: 0; }
  .list-container::-webkit-scrollbar { width: 6px; }
  .list-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  
  .list-item { padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
  .list-item:hover { background: var(--bg-card); }
  .li-name { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .li-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .li-val { font-weight: 700; color: #cbd5e1; }

  /* Map Area & Markers */
  #map { flex: 1; height: 100%; background: #0b0f19; z-index: 1; }
  .custom-marker { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: transparent; }
  .marker-core { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.5); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .marker-core.hover-active { transform: scale(1.6); border-color: #fff; box-shadow: 0 0 12px #fff, 0 0 4px rgba(0,0,0,0.8); }

  /* Popups */
  .leaflet-popup-content-wrapper { background: var(--bg-panel); color: var(--text-main); border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.6); padding: 0; }
  .leaflet-popup-tip { background: var(--bg-panel); }
  .leaflet-popup-content { margin: 0; width: 280px !important; }
  
  .pop-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .pop-title { font-size: 14px; font-weight: 800; color: #fff; line-height: 1.3; margin-bottom: 8px; }
  .pop-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; color: #000; letter-spacing: 0.5px;}
  
  .pop-body { padding: 16px; font-size: 12px; }
  .pop-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .pop-lbl { color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; width: 35%;}
  .pop-val { font-weight: 700; text-align: right; width: 65%; color: #f8fafc; }
  .pop-val.highlight { color: #10B981; }
  
  .pop-summary { margin-top: 12px; color: #cbd5e1; line-height: 1.5; font-size: 12px; }
  .pop-takeaway { margin-top: 12px; padding: 10px; background: rgba(0,0,0,0.2); border-left: 2px solid #38bdf8; border-radius: 0 4px 4px 0; color: #38bdf8; font-weight: 600; line-height: 1.4; font-size: 11.5px; }

  /* Optional Info Section - Lower Visual Weight */
  .pop-optional { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
  .pop-opt-row { display: flex; justify-content: space-between; align-items: flex-start; font-size: 10px; margin-bottom: 4px; }
  .pop-opt-lbl { color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; width: 35%; }
  .pop-opt-val { color: var(--text-muted); text-align: right; width: 65%; font-weight: 500; }

  /* ==========================================
     MOBILE SPECIFIC REFINEMENTS
     ========================================== */
  @media(max-width: 800px) {
    .layout { display: block; }
    #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; }
    
    .sidebar { 
      position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; 
      border-top: 1px solid var(--border); border-right: none;
      border-radius: 16px 16px 0 0;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden; 
      z-index: 2000;
    }
    
    .sidebar.expanded { height: 85vh; }
    
    /* Hide interior components when collapsed to prevent bleed/interaction */
    .sidebar:not(.expanded) .header,
    .sidebar:not(.expanded) .filters,
    .sidebar:not(.expanded) .list-container {
      display: none;
    }

    .mobile-handle {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
      cursor: pointer; flex-shrink: 0; width: 100%;
    }
    .handle-bar { width: 40px; height: 4px; background: var(--text-muted); border-radius: 2px; margin-bottom: 6px; }
    .handle-lbl { font-size: 12px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }

    .cat-btn { padding: 12px 16px; font-size: 13px; }
    .val-btn { padding: 12px 0; font-size: 12px; }
    .search-box { padding: 14px; font-size: 16px; }

    .leaflet-popup-content { width: 300px !important; max-width: 85vw !important; }
    .pop-title { font-size: 15px; }
    .pop-body { font-size: 13px; }
  }
</style>

  { id: "sig_46", project_name: "Sample Road Logistics", address: "Sample Rd & I-95", city: "Pompano Beach", latitude: 26.2735, longitude: -80.1350, category: "Under Construction", stage: "Active", signal_type: "Shell Permit", declared_value: 8900000, value_label: "$8.9M", summary: "Logistics shell permit execution confirms active last-mile demand.", operator_takeaway: "Active last-mile demand executing at major highway interchanges." }
];

// ==========================================
// 2. CONFIGURATION & STATE
// ==========================================

const CAT_COLORS = {
  "Land in Play": "#A855F7",
  "In Approvals": "#F59E0B",
  "Pre-Construction": "#3B82F6",
  "Under Construction": "#10B981",
  "Capital Repositioning": "#F43F5E"
};

const CATEGORIES = Object.keys(CAT_COLORS);

let activeCategories = new Set(CATEGORIES);
let minValFilter = 0; // 0 = All
let markers = {}; 

// Jitter mechanism for overlapping coords
const coordMap = new Set();
signals.forEach(s => {
  let coordKey = `${s.latitude},${s.longitude}`;
  while (coordMap.has(coordKey)) {
    s.latitude += (Math.random() - 0.5) * 0.001;
    s.longitude += (Math.random() - 0.5) * 0.001;
    coordKey = `${s.latitude},${s.longitude}`;
  }
  coordMap.add(coordKey);
});

// Initialize Leaflet
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([26.15, -80.14], 11);
L.control.zoom({ position: 'topright' }).addTo(map);

// Premium Dark Base Map
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19
}).addTo(map);

// ==========================================
// 3. CORE LOGIC & SEARCH
// ==========================================

// Mobile Toggle Logic
const sidebar = document.getElementById('sidebar');
const mobileToggle = document.getElementById('mobile-toggle');
const mobileToggleLbl = document.getElementById('mobile-toggle-lbl');

mobileToggle.addEventListener('click', () => {
  sidebar.classList.toggle('expanded');
  const isExpanded = sidebar.classList.contains('expanded');
  
  if(isExpanded) {
    mobileToggleLbl.innerText = "Hide Signals";
    map.dragging.disable();
    map.scrollWheelZoom.disable();
    if(map.touchZoom) map.touchZoom.disable();
    if(map.doubleClickZoom) map.doubleClickZoom.disable();
    if(map.boxZoom) map.boxZoom.disable();
    if(map.keyboard) map.keyboard.disable();
  } else {
    updateMobileHandleLabel();
    map.dragging.enable();
    map.scrollWheelZoom.enable();
    if(map.touchZoom) map.touchZoom.enable();
    if(map.doubleClickZoom) map.doubleClickZoom.enable();
    if(map.boxZoom) map.boxZoom.enable();
    if(map.keyboard) map.keyboard.enable();
  }
  setTimeout(() => map.invalidateSize(), 350);
});

function updateMobileHandleLabel() {
  if(!sidebar.classList.contains('expanded')) {
    const visibleCount = document.getElementById('stat-count').innerText;
    mobileToggleLbl.innerText = `View ${visibleCount} Signals`;
  }
}

document.getElementById('search-box').addEventListener('input', applyFilters);

// Value Helper Function
function getEffectiveValue(signal) {
  if (signal.declared_value !== null && signal.declared_value !== undefined) {
    return signal.declared_value;
  }
  if (signal.value_label && signal.value_label.includes('Est.')) {
    const regex = /\$([\d\.]+)([MBK]?)/gi;
    let matches = [];
    let match;
    while ((match = regex.exec(signal.value_label)) !== null) {
      let num = parseFloat(match[1]);
      let mult = match[2] ? match[2].toUpperCase() : '';
      if (mult === 'B') num *= 1000000000;
      else if (mult === 'M') num *= 1000000;
      else if (mult === 'K') num *= 1000;
      matches.push(num);
    }
    if (matches.length === 1) return matches[0];
    if (matches.length > 1) return (matches[0] + matches[1]) / 2;
  }
  return null;
}

function initMap() {
  document.getElementById('stat-total').innerText = signals.length;
  buildCategoryFilters();
  setupValueFilters();
  
  signals.forEach(s => {
    const color = CAT_COLORS[s.category];
    const icon = L.divIcon({
      className: 'custom-marker',
      html: `<div class="marker-core" style="background-color: ${color}; border-color: ${color};"></div>`,
      iconSize: [36, 36], 
      iconAnchor: [18, 18]
    });

    const mk = L.marker([s.latitude, s.longitude], { icon: icon }).addTo(map);
    
    let optionalFields = '';
    if (s.key_players || s.scale || s.timeline || s.permit_number) {
      optionalFields = `<div class="pop-optional">`;
      if (s.key_players) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Players</span><span class="pop-opt-val">${s.key_players}</span></div>`;
      if (s.scale) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Scale</span><span class="pop-opt-val">${s.scale}</span></div>`;
      if (s.timeline) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Timeline</span><span class="pop-opt-val">${s.timeline}</span></div>`;
      if (s.permit_number) optionalFields += `<div class="pop-opt-row"><span class="pop-opt-lbl">Permit #</span><span class="pop-opt-val">${s.permit_number}</span></div>`;
      optionalFields += `</div>`;
    }
    
    mk.bindPopup(`
      <div class="pop-header" style="border-top: 4px solid ${color}">
        <div class="pop-title">${s.project_name}</div>
        <div class="pop-badge" style="background-color: ${color}33; color: ${color}; border: 1px solid ${color}66;">
          ${s.category} | ${s.stage}
        </div>
      </div>
      <div class="pop-body">
        <div class="pop-row"><span class="pop-lbl">Address</span><span class="pop-val">${s.address}, ${s.city}</span></div>
        <div class="pop-row"><span class="pop-lbl">Value</span><span class="pop-val highlight">${s.value_label}</span></div>
        
        <div class="pop-summary">${s.summary}</div>
        <div class="pop-takeaway">Signal: ${s.operator_takeaway}</div>
        
        ${optionalFields}
      </div>
    `);

    mk.on('click', () => map.flyTo([s.latitude, s.longitude], 15, { duration: 0.8 }));
    markers[s.id] = { data: s, layer: mk };
  });

  applyFilters();
}

function buildCategoryFilters() {
  const container = document.getElementById('cat-filters');
  CATEGORIES.forEach(cat => {
    const color = CAT_COLORS[cat];
    const btn = document.createElement('button');
    btn.className = 'cat-btn active';
    btn.innerHTML = `<div class="cat-indicator" style="background-color: ${color}; box-shadow: 0 0 4px ${color};"></div> ${cat}`;
    
    btn.onclick = () => {
      if (activeCategories.has(cat)) {
        activeCategories.delete(cat);
        btn.classList.remove('active');
        btn.querySelector('.cat-indicator').style.opacity = '0.2';
      } else {
        activeCategories.add(cat);
        btn.classList.add('active');
        btn.querySelector('.cat-indicator').style.opacity = '1';
      }
      applyFilters();
    };
    container.appendChild(btn);
  });
}

function setupValueFilters() {
  const btns = document.querySelectorAll('.val-btn');
  btns.forEach(btn => {
    btn.onclick = () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      minValFilter = parseInt(btn.getAttribute('data-val'));
      applyFilters();
    };
  });
}

function formatMoney(num) {
  if (num === 0) return '$0';
  if (num >= 1000000000) return '$' + (num / 1000000000).toFixed(1) + 'B';
  if (num >= 1000000) return '$' + (num / 1000000).toFixed(1) + 'M';
  if (num >= 1000) return '$' + (num / 1000).toFixed(0) + 'K';
  return '$' + num;
}

function applyFilters() {
  let activeCount = 0;
  let totalValue = 0;
  const listContainer = document.getElementById('signal-list');
  listContainer.innerHTML = '';
  
  const searchTerm = document.getElementById('search-box').value.toLowerCase();
  
  const isFiltered = activeCategories.size !== CATEGORIES.length || minValFilter > 0 || searchTerm.length > 0;
  const filterStatusEl = document.getElementById('filter-status');
  if (isFiltered) {
    filterStatusEl.innerText = "Filtered View";
    filterStatusEl.classList.add("active-filter");
  } else {
    filterStatusEl.innerText = "All Signals";
    filterStatusEl.classList.remove("active-filter");
  }

  Object.values(markers).forEach(item => {
    const s = item.data;
    const mk = item.layer;
    
    const val = getEffectiveValue(s) || 0;
    const catMatch = activeCategories.has(s.category);
    const valMatch = val >= minValFilter;
    
    const searchString = `${s.project_name} ${s.address} ${s.city} ${s.key_players || ''}`.toLowerCase();
    const searchMatch = searchString.includes(searchTerm);

    if (catMatch && valMatch && searchMatch) {
      if (!map.hasLayer(mk)) mk.addTo(map);
      activeCount++;
      totalValue += val;

      const d = document.createElement('div');
      d.className = 'list-item';
      d.style.borderLeftColor = CAT_COLORS[s.category];
      
      const isUndisclosed = s.value_label === 'Undisclosed' || s.value_label.includes('Est');
      
      d.innerHTML = `
        <div class="li-name">${s.project_name}</div>
        <div class="li-meta">
          <span>${s.category} | ${s.stage}</span>
          <span class="li-val" style="color: ${isUndisclosed ? 'var(--text-muted)' : '#cbd5e1'}">${s.value_label}</span>
        </div>
      `;
      
      d.onclick = () => {
        map.flyTo([s.latitude, s.longitude], 15, { duration: 0.8 });
        mk.openPopup();
        // Auto collapse sidebar on mobile
        if(window.innerWidth <= 800 && sidebar.classList.contains('expanded')) {
          sidebar.classList.remove('expanded');
          updateMobileHandleLabel();
          map.dragging.enable();
          map.scrollWheelZoom.enable();
          if(map.touchZoom) map.touchZoom.enable();
          if(map.doubleClickZoom) map.doubleClickZoom.enable();
          if(map.boxZoom) map.boxZoom.enable();
          if(map.keyboard) map.keyboard.enable();
          setTimeout(() => map.invalidateSize(), 350);
        }
      };
      
      d.onmouseenter = () => {
        const iconEl = mk.getElement();
        if(iconEl) {
          const core = iconEl.querySelector('.marker-core');
          if(core) core.classList.add('hover-active');
        }
      };
      
      d.onmouseleave = () => {
        const iconEl = mk.getElement();
        if(iconEl) {
          const core = iconEl.querySelector('.marker-core');
          if(core) core.classList.remove('hover-active');
        }
      };
      
      listContainer.appendChild(d);
    } else {
      if (map.hasLayer(mk)) map.removeLayer(mk);
    }
  });

  document.getElementById('stat-count').innerText = activeCount;
  document.getElementById('stat-val').innerText = formatMoney(totalValue);
  updateMobileHandleLabel();
}

setTimeout(() => {
  map.invalidateSize();
  initMap();
}, 200);

</script>
