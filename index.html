<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>THE FLORIDA SIGNAL | Premium Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0f172a; --bg-panel: #1e293b; --bg-card: #334155;
    --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
   
    /* Premium Category Colors */
    --c-land: #A855F7; /* Purple: Land in Play */
    --c-appr: #F59E0B; /* Orange: In Approvals */
    --c-pre: #3B82F6; /* Blue: Pre-Construction */
    --c-und: #10B981; /* Green: Under Construction */
    --c-cap: #F43F5E; /* Red: Capital Repositioning */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body, html { 
    height: 100%; width: 100%; overflow: hidden; 
    background-color: var(--bg-dark); color: var(--text-main); 
    padding-bottom: env(safe-area-inset-bottom); 
  }
  .layout { display: flex; height: 100vh; width: 100vw; }

  /* Mobile Handle (Hidden on Desktop) */
  .mobile-handle { display: none; }

  /* Sidebar */
  .sidebar { 
    width: 400px; background: var(--bg-dark); border-right: 1px solid var(--border); 
    display: flex; flex-direction: column; z-index: 1000; 
    box-shadow: 4px 0 15px rgba(0,0,0,0.5); 
  }
  .header { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #fff; }
  .sub-logo { font-size: 11px; font-weight: 600; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .sub-logo::before { content: ''; display: inline-block; width: 6px; height: 6px; background: #38bdf8; border-radius: 50%; }

  .filter-status { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 18px; margin-bottom: -8px; color: var(--text-muted); transition: color 0.2s; }
  .filter-status.active-filter { color: #38bdf8; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat-box { background: var(--bg-panel); padding: 12px; border-radius: 6px; border: 1px solid var(--border); }
  .stat-val { font-size: 20px; font-weight: 800; color: #fff; }
  .stat-lbl { font-size: 10px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); margin-top: 4px; line-height: 1.3; }

  .filters { 
    padding: 16px 20px; border-bottom: 1px solid var(--border); 
    background: var(--bg-panel); flex-shrink: 0; 
  }
 
  /* Search Bar */
  .search-box { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 12px; outline: none; margin-bottom: 16px; transition: border-color 0.2s; }
  .search-box:focus { border-color: #38bdf8; }
  .search-box::placeholder { color: var(--text-muted); }
  .filter-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; display: block; }
  .cat-filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .cat-btn { display: flex; align-items: center; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; text-align: left; }
  .cat-btn:hover { background: var(--bg-card); }
  .cat-btn.active { color: #fff; border-color: currentColor; background: rgba(255,255,255,0.05); }
  .cat-indicator { width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; }
  .val-filters { display: flex; gap: 6px; }
  .val-btn { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 0; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; text-align: center; }
  .val-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

  .list-container { 
    flex: 1 1 auto; overflow-y: auto; padding: 0 0 20px 0; 
    -webkit-overflow-scrolling: touch; 
  }
  .list-container::-webkit-scrollbar { width: 6px; }
  .list-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .list-item { padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
  .list-item:hover { background: var(--bg-card); }
  .li-name { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .li-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .li-val { font-weight: 700; color: #cbd5e1; }

  /* Map Area */
  #map { flex: 1; height: 100%; background: #0b0f19; z-index: 1; }

  /* Leaflet Dark Map Improvements */
  .leaflet-tile-container {
    filter: brightness(1.12) contrast(1.08);
  }

  /* Popups */
  .leaflet-popup-content-wrapper { background: var(--bg-panel); color: var(--text-main); border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.6); padding: 0; }
  .leaflet-popup-tip { background: var(--bg-panel); }
  .leaflet-popup-content { margin: 0; width: 280px !important; }

  .pop-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .pop-title { font-size: 14px; font-weight: 800; color: #fff; line-height: 1.3; margin-bottom: 8px; }
  .pop-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; color: #000; letter-spacing: 0.5px;}
 
  .pop-body { padding: 16px; font-size: 12px; }
  .pop-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .pop-lbl { color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; width: 35%;}
  .pop-val { font-weight: 700; text-align: right; width: 65%; color: #f8fafc; }
  .pop-val.highlight { color: #10B981; }
 
  .pop-summary { margin-top: 12px; color: #cbd5e1; line-height: 1.5; font-size: 12px; }
  .pop-takeaway { margin-top: 12px; padding: 10px; background: rgba(0,0,0,0.2); border-left: 2px solid #38bdf8; border-radius: 0 4px 4px 0; color: #38bdf8; font-weight: 600; line-height: 1.4; font-size: 11.5px; }

  /* MOBILE SPECIFIC */
  @media(max-width: 800px) {
    .layout { display: block; }
    #map { 
      height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; 
    }
   
    .sidebar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
      border-top: 1px solid var(--border); border-right: none;
      border-radius: 16px 16px 0 0;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      z-index: 2000;
      padding-bottom: env(safe-area-inset-bottom);
    }
   
    .sidebar.expanded { 
      height: calc(88vh - env(safe-area-inset-bottom)); 
    }
   
    .sidebar:not(.expanded) .header,
    .sidebar:not(.expanded) .filters,
    .sidebar:not(.expanded) .list-container {
      display: none;
    }
    .mobile-handle {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
      cursor: pointer; flex-shrink: 0; width: 100%;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .handle-bar { width: 40px; height: 4px; background: var(--text-muted); border-radius: 2px; margin-bottom: 6px; }
    .handle-lbl { font-size: 12px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }

    .cat-btn { padding: 12px 16px; font-size: 13px; }
    .val-btn { padding: 12px 0; font-size: 12px; }
    .search-box { padding: 14px; font-size: 16px; }
    .leaflet-popup-content { width: 300px !important; max-width: 85vw !important; }
    .pop-title { font-size: 15px; }
    .pop-body { font-size: 13px; }

    .list-container {
      padding-bottom: calc(30px + env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="mobile-handle" id="mobile-toggle">
      <div class="handle-bar"></div>
      <span class="handle-lbl" id="mobile-toggle-lbl">Signals</span>
    </div>
    <div class="header">
      <div class="logo">The Florida Signal</div>
      <div class="sub-logo">Terminal Access | Broward County</div>
     
      <div class="filter-status" id="filter-status">All Signals</div>
     
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="stat-count">0</div>
          <div class="stat-lbl">Showing (of <span id="stat-total">0</span> Total)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-val">$0</div>
          <div class="stat-lbl">Tracked Value <br>(Declared + Est.)</div>
        </div>
      </div>
    </div>
    <div class="filters">
      <input type="text" id="search-box" class="search-box" placeholder="Search projects, developers, or addresses...">
     
      <span class="filter-lbl">Category Selection</span>
      <div class="cat-filters" id="cat-filters"></div>
     
      <span class="filter-lbl" style="margin-top:16px;">Minimum Value</span>
      <div class="val-filters">
        <button class="val-btn active" data-val="0">All</button>
        <button class="val-btn" data-val="10000000">$10M+</button>
        <button class="val-btn" data-val="20000000">$20M+</button>
        <button class="val-btn" data-val="30000000">$30M+</button>
      </div>
    </div>
    <div class="list-container" id="signal-list"></div>
  </aside>
  <div id="map"></div>
</div>

</body>
</html>
