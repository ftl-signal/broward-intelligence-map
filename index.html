<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>THE FLORIDA SIGNAL: BROWARD COUNTY (Tracking 2026)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --c-lead:#DC2626; --c-pipeline:#4F46E5; --c-inst:#059669; --c-consumer:#7C3AED;
  --c-corridor:#6B7280; --c-accent:#F59E0B; --c-navy:#162133; --c-s100:#F1F5F9;
  --c-s200:#E2E8F0; --c-s500:#64748B;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.app{display:flex;flex-direction:column;height:100vh;width:100vw;background:#fff;}
#map{flex:1;width:100%;height:100%;z-index:1;background:#f8f9fa;}

.sidebar {
  width:100%; height:45vh; background:rgba(255,255,255,0.98); backdrop-filter:blur(12px);
  border-top:1px solid var(--c-s200); position:fixed; bottom:0; left:0; z-index:100;
  transition:height 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow:0 -4px 25px rgba(0,0,0,0.12); display:flex; flex-direction:column;
}
.sidebar.expanded{height:88vh;}

@media(min-width:841px){
  .app{flex-direction:row;}
  .sidebar{width:440px; height:100vh; position:relative; border-top:none; border-right:1px solid var(--c-s200); box-shadow:none;}
  .sheet-handle{display:none;}
}

.sheet-handle{padding:14px 0; text-align:center; background:#fff; border-bottom:1px solid var(--c-s200); cursor:pointer;}
.handle-bar{width:40px; height:5px; background:#cbd5e1; border-radius:999px; margin:0 auto;}

.sb-header{background:linear-gradient(145deg,#0a0f1e,#162133); color:#fff; padding:20px 16px; border-bottom:3px solid var(--c-accent);}
.hdr-title{font-size:18px; font-weight:900; margin-bottom:2px; line-height:1.2; text-transform:uppercase;}
.hdr-sub{font-size:10px; font-weight:700; color:var(--c-accent); text-transform:uppercase; letter-spacing:1px;}

.sub-btn {
  display:block; width:100%; margin-top:12px; padding:14px; background:var(--c-accent);
  color:#0a0f1e; border:none; border-radius:10px; font-weight:900; font-size:11px;
  text-decoration:none; text-align:center; text-transform:uppercase;
}

.stats-row{display:flex; gap:8px; margin-top:14px;}
.stat{flex:1; display:flex; flex-direction:column; align-items:center; padding:8px; background:rgba(255,255,255,.05); border-radius:8px;}
.stat-val{font-size:16px; font-weight:900;}
.stat-lbl{font-size:8px; text-transform:uppercase; color:var(--c-s500); margin-top:2px;}

.filters{padding:12px 16px; border-bottom:1px solid var(--c-s200);}
.chips{display:flex; flex-wrap:wrap; gap:4px;}
.chip{
  padding:6px 10px; border-radius:999px; font-size:9px; font-weight:700; color:#fff; 
  cursor:pointer; transition: all 0.2s; border: 1px solid transparent;
  white-space: nowrap;
}
.chip.off{opacity:0.2; filter: grayscale(1); transform: scale(0.95);}

.count-bar{padding:10px 16px; font-size:12px; font-weight:700; display:flex; justify-content:space-between; background:var(--c-s100); border-bottom:1px solid var(--c-s200); color:var(--c-navy);}
.reset-btn{color:#3b82f6; border:none; background:none; font-weight:800; font-size:10px; cursor:pointer;}

.sidebar-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.list-item{padding:14px 16px; border-bottom:1px solid #f1f5f9; cursor:pointer; border-left:4px solid transparent; transition: background 0.2s;}
.list-item.active{background:#f0f9ff; border-left-color:var(--c-accent);}
.li-name{font-size:13px; font-weight:700; color:var(--c-navy);}
.li-addr{font-size:11px; color:var(--c-s500);}

.leaflet-popup-content-wrapper{border-radius:14px; padding:0; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.18);}
.pu-head{padding:12px 16px; color:#fff;}
.pu-name{font-size:16px; font-weight:800; line-height:1.1;}
.pu-date{font-size:10px; text-transform:uppercase; opacity:0.8; margin-top:4px; font-weight:700; letter-spacing:0.5px;}
.pu-body{padding:14px 18px; font-size:13px; line-height:1.55;}
.pu-intel{margin-top:12px; padding-top:12px; border-top:1px solid #eee; font-style:italic; color:#334155; font-weight:500;}

.dot-marker {
  border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: opacity 0.4s ease, transform 0.3s ease;
}
</style>
</head>

    <div class="filters">

    </div>
    <div class="count-bar"><span id="countText"></span><button class="reset-btn" id="resetBtn">RESET MAP</button></div>
    <div class="sidebar-scroll" id="listContainer"></div>

</div>

];

const CAT_COLORS = {"Lead Signals":"#DC2626","Planning Pipeline":"#4F46E5","Institutional / Public Capital":"#059669","Consumer / Tenant Openings":"#7C3AED","Corridor / Area Watch":"#6B7280"};
const CATS = Object.keys(CAT_COLORS);
const TFS = ["23", "16", "9"];

let aCats = new Set(CATS), aTfs = new Set(["23", "16"]), markers = {}, activeId = null;

const map = L.map('map', { zoomControl: false, tap: true }).setView([26.13, -80.13], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

function safeClick(el, fn) {
  if (!el) return;
  el.addEventListener('click', fn);
  el.addEventListener('touchend', (e) => { e.preventDefault(); fn(); }, { passive: false });
}

signals.forEach(s => {
  const color = CAT_COLORS[s.category] || '#3388ff';
  const icon = L.divIcon({
    className: 'dot-marker',
    html: `<div style="background-color:${color}; width:15px; height:15px; border-radius:50%;"></div>`,
    iconSize: [15, 15]
  });

  const mk = L.marker([s.lat, s.lng], { icon: icon }).addTo(map);
  mk.bindPopup(`
    <div class="pu-head" style="background:${color}">
      <div class="pu-name">${s.name}</div>
      <div class="pu-date">Date: ${s.publishDate}</div>
    </div>
    <div class="pu-body">
      <b>Address:</b> ${s.address}<br>
      <b>Status:</b> ${s.value || 'Active permit tracking'}
      <div class="pu-intel"><b>The Signal:</b> This ${s.intel || 'indicates local momentum.'}</div>
    </div>
  `);
  mk.on('click', () => highlightList(s.id));
  markers[s.id] = { layer: mk, ed: s.ed };
});

function buildFilters() {
  const cc = document.getElementById('catChips'), tc = document.getElementById('tfChips');
  cc.innerHTML = ''; tc.innerHTML = '';
  CATS.forEach(c => {
    const d = document.createElement('div'); d.className = 'chip'; d.style.background = CAT_COLORS[c];
    d.innerHTML = c.split(' ')[0];
    safeClick(d, () => { aCats.has(c) ? aCats.delete(c) : aCats.add(c); d.classList.toggle('off'); applyStyles(); });
    cc.appendChild(d);
  });
  TFS.forEach(t => {
    const d = document.createElement('div');
    const isActive = aTfs.has(t);
    d.className = `chip ${isActive ? '' : 'off'}`; d.style.background = '#1E293B';
    d.innerHTML = 'Ed. ' + t;
    safeClick(d, () => { aTfs.has(t) ? aTfs.delete(t) : aTfs.add(t); d.classList.toggle('off'); applyStyles(); });
    tc.appendChild(d);
  });
}

function applyStyles() {
  let count = 0;
  signals.forEach(s => {
    const m = markers[s.id];
    const isVisible = aCats.has(s.category);
    const isBright = aTfs.has(s.ed);
    if (isVisible) {
      m.layer.addTo(map);
      m.layer.getElement().style.opacity = isBright ? "1.0" : "0.15";
      m.layer.getElement().style.transform = isBright ? "scale(1.2)" : "scale(0.85)";
      if (isBright) count++;
    } else { map.removeLayer(m.layer); }
  });
  document.getElementById('statSignals').textContent = count;
  buildList();
}

function buildList() {
  const lc = document.getElementById('listContainer'); lc.innerHTML = '';
  const vis = signals.filter(s => aCats.has(s.category) && aTfs.has(s.ed));
  document.getElementById('countText').innerHTML = vis.length + ' signals in view';
  vis.forEach(s => {
    const d = document.createElement('div'); d.className = 'list-item'; d.id = 'li-' + s.id;
    d.style.borderLeftColor = CAT_COLORS[s.category];
    d.innerHTML = `<div class="li-name">${s.name}</div><div class="li-addr">${s.address}</div>`;
    safeClick(d, () => {
      map.flyTo([s.lat, s.lng], 14); markers[s.id].layer.openPopup(); highlightList(s.id);
      if (window.innerWidth < 841) {
        document.getElementById('sidebar').classList.remove('expanded');
        setTimeout(() => map.invalidateSize(), 450);
      }
    });
    lc.appendChild(d);
  });
}

function highlightList(id) {
  if (activeId) document.getElementById('li-' + activeId)?.classList.remove('active');
  const el = document.getElementById('li-' + id);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  activeId = id;
}

safeClick(document.getElementById('sheetHandle'), () => {
  document.getElementById('sidebar').classList.toggle('expanded');
  setTimeout(() => map.invalidateSize(), 450);
});

safeClick(document.getElementById('resetBtn'), () => {
  const sortedTfs = [...TFS].sort((a,b) => b-a);
  const latestTwo = sortedTfs.slice(0, 2);
  aCats = new Set(CATS); aTfs = new Set(latestTwo);
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.remove('off');
    const txt = c.innerHTML;
    if (txt.includes('Ed. ') && !latestTwo.some(ed => txt.includes(ed))) c.classList.add('off');
  });
  applyStyles(); map.setView([26.13, -80.13], 11);
});

setTimeout(() => map.invalidateSize(), 100);
buildFilters(); applyStyles();
</script>
</body>
</html>
