<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Florida Signal | Map Preview</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0f172a;
    --c-land: #A855F7;  
    --c-appr: #F59E0B;  
    --c-pre:  #3B82F6;  
    --c-und:  #10B981;  
    --c-cap:  #F43F5E;  
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body, html { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg-dark); }

  /* Map Container fills the entire iframe */
  #map { width: 100vw; height: 100vh; height: 100dvh; background: #1a1e24; z-index: 1; }

  /* Brightness specifically tuned for fast readability in homepage embeds */
  .leaflet-tile-pane { filter: brightness(2.8) contrast(0.9) saturate(1.1) !important; } 

  /* Map Markers - using the larger 44x44 target size for consistency */
  .custom-marker { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: transparent; }
  .marker-core { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.5); }

  /* Full-Screen Clickable Overlay */
  .preview-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    background: rgba(15, 23, 42, 0.15); /* Subtle dark wash helps the CTA pop */
    cursor: pointer;
  }

  /* Centered Pulsing CTA */
  .cta-button {
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(56, 189, 248, 0.6);
    color: #ffffff;
    padding: 16px 32px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    animation: pulse-glow 2.5s infinite;
  }

  @keyframes pulse-glow {
    0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4), 0 8px 25px rgba(0,0,0,0.5); }
    70% { box-shadow: 0 0 0 15px rgba(56, 189, 248, 0), 0 8px 25px rgba(0,0,0,0.5); }
    100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0), 0 8px 25px rgba(0,0,0,0.5); }
  }
</style>
</head>
<body>

  <a href="YOUR_LIVE_MAP_URL_HERE.html" target="_top" class="preview-overlay" aria-label="Open Full Map">
    <div class="cta-button">EXPLORE LIVE SIGNALS</div>
  </a>
  
  <div id="map"></div>

<script>
// ==========================================
// 1. DATA ARCHITECTURE
// ==========================================
const signals = [
  { id: "sig_01", latitude: 26.1215, longitude: -80.1472, category: "Pre-Construction" },
  { id: "sig_02", latitude: 26.1360, longitude: -80.1450, category: "Pre-Construction" },
  { id: "sig_10", latitude: 26.1385, longitude: -80.1215, category: "Under Construction" },
  { id: "sig_04", latitude: 26.0112, longitude: -80.1158, category: "Land in Play" },
  { id: "sig_05", latitude: 26.2230, longitude: -80.0900, category: "In Approvals" },
  { id: "sig_03", latitude: 26.1195, longitude: -80.1390, category: "Under Construction" },
  { id: "sig_06", latitude: 26.2730, longitude: -80.1600, category: "In Approvals" },
  { id: "sig_07", latitude: 26.1180, longitude: -80.1400, category: "Capital Repositioning" },
  { id: "sig_08", latitude: 26.1450, longitude: -80.1150, category: "Under Construction" },
  { id: "sig_09", latitude: 26.1220, longitude: -80.1430, category: "Under Construction" },
  { id: "sig_11", latitude: 26.1288, longitude: -80.1510, category: "Under Construction" },
  { id: "sig_12", latitude: 26.1010, longitude: -80.1150, category: "Pre-Construction" },
  { id: "sig_13", latitude: 26.1230, longitude: -80.1400, category: "Under Construction" },
  { id: "sig_14", latitude: 26.1205, longitude: -80.1410, category: "Capital Repositioning" },
  { id: "sig_15", latitude: 26.1265, longitude: -80.1110, category: "Land in Play" },
  { id: "sig_16", latitude: 26.1275, longitude: -80.1395, category: "Pre-Construction" },
  { id: "sig_17", latitude: 26.2080, longitude: -80.1700, category: "Pre-Construction" },
  { id: "sig_18", latitude: 26.1000, longitude: -80.1250, category: "Capital Repositioning" },
  { id: "sig_19", latitude: 26.1365, longitude: -80.1200, category: "In Approvals" },
  { id: "sig_20", latitude: 26.2345, longitude: -80.1190, category: "In Approvals" },
  { id: "sig_21", latitude: 26.2110, longitude: -80.1550, category: "Under Construction" },
  { id: "sig_22", latitude: 26.1050, longitude: -80.1440, category: "Pre-Construction" },
  { id: "sig_23", latitude: 26.1650, longitude: -80.0980, category: "Capital Repositioning" },
  { id: "sig_24", latitude: 26.1050, longitude: -80.1500, category: "In Approvals" },
  { id: "sig_25", latitude: 26.1150, longitude: -80.1300, category: "Land in Play" },
  { id: "sig_26", latitude: 26.1290, longitude: -80.1385, category: "In Approvals" },
  { id: "sig_27", latitude: 26.2250, longitude: -80.0910, category: "In Approvals" },
  { id: "sig_28", latitude: 26.0200, longitude: -80.1700, category: "Land in Play" },
  { id: "sig_29", latitude: 26.2500, longitude: -80.1400, category: "Capital Repositioning" },
  { id: "sig_30", latitude: 26.2250, longitude: -80.1650, category: "In Approvals" },
  { id: "sig_31", latitude: 26.1705, longitude: -80.1325, category: "Capital Repositioning" },
  { id: "sig_32", latitude: 26.2515, longitude: -80.0910, category: "Pre-Construction" },
  { id: "sig_33", latitude: 26.1210, longitude: -80.1750, category: "In Approvals" },
  { id: "sig_34", latitude: 26.1280, longitude: -80.1440, category: "Capital Repositioning" },
  { id: "sig_35", latitude: 26.1250, longitude: -80.1380, category: "Pre-Construction" },
  { id: "sig_36", latitude: 26.2350, longitude: -80.0880, category: "Pre-Construction" },
  { id: "sig_37", latitude: 26.0120, longitude: -80.1500, category: "In Approvals" },
  { id: "sig_38", latitude: 26.0150, longitude: -80.1150, category: "Land in Play" },
  { id: "sig_39", latitude: 26.2320, longitude: -80.0950, category: "In Approvals" },
  { id: "sig_42", latitude: 26.1055, longitude: -80.1430, category: "Under Construction" },
  { id: "sig_43", latitude: 26.1245, longitude: -80.1445, category: "Land in Play" },
  { id: "sig_44", latitude: 26.1185, longitude: -80.1440, category: "Land in Play" },
  { id: "sig_45", latitude: 26.2625, longitude: -80.0885, category: "In Approvals" },
  { id: "sig_46", latitude: 26.2735, longitude: -80.1350, category: "Under Construction" }
];

const CAT_COLORS = {
  "Land in Play": "#A855F7",
  "In Approvals": "#F59E0B",
  "Pre-Construction": "#3B82F6",
  "Under Construction": "#10B981",
  "Capital Repositioning": "#F43F5E"
};

// Jitter mechanism
const coordMap = new Set();
signals.forEach(s => {
  let coordKey = `${s.latitude},${s.longitude}`;
  while (coordMap.has(coordKey)) {
    s.latitude += (Math.random() - 0.5) * 0.001;
    s.longitude += (Math.random() - 0.5) * 0.001;
    coordKey = `${s.latitude},${s.longitude}`;
  }
  coordMap.add(coordKey);
});

// ==========================================
// 2. MAP INITIALIZATION & DYNAMIC FRAMING
// ==========================================
// Map interactions totally locked down for safe scrolling over the iframe
const map = L.map('map', { 
  zoomControl: false, 
  attributionControl: false,
  dragging: false,
  scrollWheelZoom: false,
  doubleClickZoom: false,
  boxZoom: false,
  touchZoom: false,
  keyboard: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19
}).addTo(map);

// Array to store coordinates for bounds calculation
const latLngs = [];

// Render stripped-down visual markers
signals.forEach(s => {
  const color = CAT_COLORS[s.category];
  const icon = L.divIcon({
    className: 'custom-marker',
    html: `<div class="marker-core" style="background-color: ${color}; border-color: ${color};"></div>`,
    iconSize: [44, 44], 
    iconAnchor: [22, 22]
  });

  L.marker([s.latitude, s.longitude], { icon: icon }).addTo(map);
  latLngs.push([s.latitude, s.longitude]);
});

// Calculate exact bounding box of all pins and center the map perfectly
// Eliminates awkward empty ocean space on the right
const bounds = L.latLngBounds(latLngs);
map.fitBounds(bounds, { padding: [40, 40] });

// Redraw safety for iframes
setTimeout(() => { map.invalidateSize(); }, 200);

</script>
</body>
</html>
