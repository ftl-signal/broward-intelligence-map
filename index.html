<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florida Signal | Intelligence Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1a;
    --ink:#e8f0ff;
    --ink-dim:#8ea3c2;
    --ink-muted:#5f748f;
    --cyan:#22d3ee;
    --line:rgba(34,211,238,0.08);
    --line-strong:rgba(34,211,238,0.22);
    --panel:rgba(10,15,26,0.82);
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  html,body{height:100%;width:100%;overflow:hidden;background:transparent;color:var(--ink)}

  /* ---------- MAP ---------- */
  #map{
    position:absolute;inset:0;
    width:100vw;height:100vh;
    background:#0a0f1a;
    cursor:grab;
  }
  #map.leaflet-dragging,
  #map.leaflet-dragging .leaflet-grab{cursor:grabbing}
  .leaflet-tile-pane{
    filter:
      brightness(1.05)
      contrast(1.08)
      saturate(0.85)
      hue-rotate(-4deg);
  }
  .leaflet-container{background:#0a0f1a;outline:none}

  /* ---------- ATMOSPHERE ---------- */
  .atmos{position:absolute;inset:0;pointer-events:none;z-index:400}
  .atmos .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 72px 72px, 72px 72px;
    mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 40%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 40%, transparent 85%);
    opacity:0.32;
  }
  @keyframes scan {
    0% { transform: translateY(-10%); opacity:0 }
    8% { opacity:0.55 }
    92% { opacity:0.55 }
    100% { transform: translateY(110%); opacity:0 }
  }
  .atmos .scan{
    position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, rgba(34,211,238,0.4), transparent);
    box-shadow:0 0 18px rgba(34,211,238,0.45);
    animation: scan 14s linear infinite;
  }

  /* ---------- LIVE STATUS (top-left) ---------- */
  .hud-status{
    position:absolute;z-index:550;
    top:16px;left:16px;
    padding:10px 14px;
    background:var(--panel);
    border:1px solid var(--line-strong);
    border-radius:10px;
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    display:flex;align-items:center;gap:10px;
  }
  .hud-status .live-dot{
    width:8px;height:8px;border-radius:50%;
    background:#10B981;
    box-shadow:0 0 10px #10B981;
    animation:livepulse 2s ease-in-out infinite;
  }
  @keyframes livepulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:0.55;transform:scale(1.25)}
  }
  .hud-status .live-txt{
    font-family:var(--mono);font-size:10px;letter-spacing:1.6px;
    color:var(--ink);text-transform:uppercase;font-weight:700;
  }
  .hud-status .live-sub{
    font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;
    color:var(--ink-muted);text-transform:uppercase;font-weight:500;
    margin-left:4px;padding-left:10px;border-left:1px solid rgba(255,255,255,0.08);
  }
  @media (max-width: 560px){ .hud-status .live-sub{display:none} }

  /* ---------- CATEGORY FILTERS (top-right) ---------- */
  .hud-filters{
    position:absolute;z-index:550;
    top:16px;right:16px;
    padding:10px 12px;
    background:var(--panel);
    border:1px solid var(--line-strong);
    border-radius:10px;
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    max-width:calc(100vw - 220px);
  }
  .filters-title{
    font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--ink-muted);
    text-transform:uppercase;margin-bottom:8px;font-weight:700;
  }
  .filters-row{display:flex;flex-wrap:wrap;gap:6px}
  .f-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 9px;border-radius:6px;
    font-size:10px;font-weight:600;letter-spacing:0.4px;
    background:rgba(255,255,255,0.04);
    color:var(--ink-dim);
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;user-select:none;
    transition:all 0.15s;
  }
  .f-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
  .f-chip:hover{background:rgba(255,255,255,0.08);color:var(--ink)}
  .f-chip.off{opacity:0.32;filter:grayscale(0.4)}
  .f-chip.off .dot{box-shadow:none}
  @media (max-width: 560px){
    .hud-filters{left:16px;right:16px;top:auto;bottom:16px;max-width:none}
  }

  /* ---------- LEGEND (bottom-left; hidden on narrow) ---------- */
  .hud-legend{
    position:absolute;z-index:500;pointer-events:none;
    bottom:16px;left:16px;
    padding:10px 12px;
    background:var(--panel);
    border:1px solid var(--line-strong);
    border-radius:10px;
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  .lg-title{
    font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--ink-muted);
    text-transform:uppercase;margin-bottom:7px;font-weight:700;
    display:flex;align-items:center;gap:6px;
  }
  .lg-title::before{content:"";width:14px;height:1px;background:var(--line-strong)}
  .lg-row{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-dim);padding:2px 0;font-weight:500}
  .lg-swatch{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
    box-shadow:0 0 8px currentColor;
  }
  @media (max-width: 900px){ .hud-legend{display:none} }

  /* ---------- ZOOM CONTROL (custom styled, bottom-right) ---------- */
  .leaflet-control-zoom{
    border:1px solid var(--line-strong) !important;
    border-radius:10px !important;
    overflow:hidden;
    background:var(--panel) !important;
    box-shadow:0 10px 30px rgba(0,0,0,0.45) !important;
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    margin:0 !important;
  }
  .leaflet-control-zoom a{
    background:transparent !important;
    color:var(--ink) !important;
    border:none !important;
    border-bottom:1px solid rgba(255,255,255,0.06) !important;
    width:32px !important;height:32px !important;
    line-height:32px !important;font-size:16px !important;font-weight:500 !important;
    transition:background 0.15s;
  }
  .leaflet-control-zoom a:last-child{border-bottom:none !important}
  .leaflet-control-zoom a:hover{
    background:rgba(34,211,238,0.12) !important;
    color:var(--cyan) !important;
  }
  .leaflet-bottom.leaflet-right{right:16px !important;bottom:16px !important}

  /* ---------- MARKERS ---------- */
  .custom-marker{
    display:flex;justify-content:center;align-items:center;
    width:100%;height:100%;background:transparent;cursor:pointer;
    position:relative;
  }
  .marker-halo{
    position:absolute;z-index:1;
    width:38px;height:38px;border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--c) 65%, transparent) 0%, transparent 70%);
    opacity:0.6;filter:blur(2px);
    transition:opacity 0.25s, transform 0.25s;
  }
  .marker-ring-static{
    position:absolute;z-index:2;
    width:20px;height:20px;border-radius:50%;
    border:1px solid color-mix(in srgb, var(--c) 75%, transparent);
    background:color-mix(in srgb, var(--c) 10%, transparent);
    box-shadow:
      inset 0 0 6px color-mix(in srgb, var(--c) 45%, transparent),
      0 0 12px color-mix(in srgb, var(--c) 50%, transparent);
  }
  .marker-core{
    position:relative;z-index:4;
    width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff 0%, var(--c) 45%, color-mix(in srgb, var(--c) 60%, #000) 100%);
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.95),
      0 0 14px 2px var(--c),
      0 0 30px 4px color-mix(in srgb, var(--c) 65%, transparent),
      0 2px 10px rgba(0,0,0,0.8);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), box-shadow 0.25s;
  }
  .marker-core::after{
    content:"";position:absolute;inset:0;margin:auto;
    width:3px;height:3px;border-radius:50%;
    background:#ffffff;opacity:0.95;
    box-shadow:0 0 5px #fff;
  }
  .marker-ring{
    position:absolute;z-index:2;
    width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--c);
    opacity:0.9;
    animation: pulseRing 2.8s ease-out infinite;
    pointer-events:none;
  }
  .marker-ring.r2{ animation-delay: 1.4s; }
  @keyframes pulseRing{
    0%   { transform:scale(1);   opacity:0.8 }
    80%  { transform:scale(3.0); opacity:0 }
    100% { transform:scale(3.0); opacity:0 }
  }
  .custom-marker:not(.priority) .marker-ring{display:none}
  .custom-marker:hover{z-index:9999}
  .custom-marker:hover .marker-halo{opacity:1;transform:scale(1.3)}
  .custom-marker:hover .marker-core{
    transform:scale(1.75);
    box-shadow:
      0 0 0 2px #fff,
      0 0 22px 4px var(--c),
      0 0 48px 10px color-mix(in srgb, var(--c) 80%, transparent),
      0 4px 18px rgba(0,0,0,0.8);
  }
  .custom-marker:hover .marker-ring-static{
    border-color:var(--c);
    background:color-mix(in srgb, var(--c) 22%, transparent);
    box-shadow:
      inset 0 0 12px color-mix(in srgb, var(--c) 65%, transparent),
      0 0 22px color-mix(in srgb, var(--c) 80%, transparent);
  }

  /* ---------- POPUP ---------- */
  .leaflet-popup-content-wrapper{
    background:linear-gradient(180deg, rgba(17,24,39,0.94) 0%, rgba(10,15,26,0.94) 100%);
    color:var(--ink);
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 24px 70px rgba(0,0,0,0.8),
      0 0 0 1px rgba(34,211,238,0.06),
      inset 0 1px 0 rgba(255,255,255,0.05);
    padding:0;overflow:hidden;
    backdrop-filter: blur(20px) saturate(170%);
    -webkit-backdrop-filter: blur(20px) saturate(170%);
  }
  .leaflet-popup-tip{
    background:rgba(10,15,26,0.94);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 8px 22px rgba(0,0,0,0.55);
  }
  .leaflet-popup-content{margin:0;width:320px !important}
  .leaflet-popup-close-button{
    color:var(--ink-dim) !important; font-size:22px !important;
    padding:10px !important; top:4px !important; right:4px !important;
    transition:color 0.2s;
  }
  .leaflet-popup-close-button:hover{color:#fff !important}
  .pop-header{
    position:relative;padding:18px 18px 14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    background:linear-gradient(180deg, color-mix(in srgb, var(--c) 14%, transparent) 0%, transparent 100%);
  }
  .pop-header::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 20%, transparent));
    box-shadow:0 0 16px var(--c);
  }
  .pop-meta{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
    font-family:var(--mono);font-size:9px;letter-spacing:1.5px;
    color:var(--ink-muted);text-transform:uppercase;font-weight:600;
  }
  .pop-meta .dot{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .pop-title{
    font-size:16px;font-weight:800;color:#fff;line-height:1.25;
    margin-bottom:12px;letter-spacing:-0.2px;
  }
  .pop-chips{display:flex;gap:6px;flex-wrap:wrap}
  .pop-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 8px;border-radius:6px;
    font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;
    background:color-mix(in srgb, var(--c) 18%, transparent);
    color:var(--c);
    border:1px solid color-mix(in srgb, var(--c) 38%, transparent);
  }
  .pop-badge.ghost{
    background:rgba(255,255,255,0.04);color:var(--ink-dim);border-color:rgba(255,255,255,0.08);
  }
  .pop-body{padding:14px 18px 18px;max-height:380px;overflow-y:auto}
  .pop-body::-webkit-scrollbar{width:6px}
  .pop-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
  .pop-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);gap:12px;
  }
  .pop-row:last-of-type{border-bottom:none}
  .pop-lbl{
    color:var(--ink-muted);font-weight:600;font-size:9px;
    text-transform:uppercase;letter-spacing:1.4px;
    min-width:72px;flex-shrink:0;padding-top:2px;
  }
  .pop-val{
    font-weight:600;text-align:right;font-size:12px;color:var(--ink);
    flex:1;word-break:break-word;
  }
  .pop-val.mono{font-family:var(--mono);font-size:11px;color:var(--ink-dim);font-weight:500}
  .pop-val.highlight{
    color:#fff;font-weight:800;font-size:14px;
    background:linear-gradient(90deg, var(--c), #fff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .pop-summary{
    margin-top:12px;padding:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    border-left:2px solid var(--c);
    border-radius:6px;
    color:var(--ink-dim);line-height:1.55;font-size:12px;
  }
  .pop-summary strong{color:var(--ink);font-weight:700}
  .leaflet-popup{animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both}
  @keyframes popIn{
    from{opacity:0;transform:translateY(6px) scale(0.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @media (max-width: 780px){ .leaflet-popup-content{width:260px !important} }

  /* ---------- SCROLL HINT ---------- */
  .scroll-hint{
    position:absolute;z-index:560;
    left:50%;top:50%;transform:translate(-50%,-50%);
    padding:14px 20px;
    background:rgba(10,15,26,0.92);
    border:1px solid var(--line-strong);
    border-radius:10px;
    font-family:var(--mono);font-size:12px;letter-spacing:1px;
    color:var(--ink);text-transform:uppercase;font-weight:600;
    pointer-events:none;opacity:0;
    transition:opacity 0.3s;
    backdrop-filter: blur(12px);
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
  }
  .scroll-hint.show{opacity:1}
  .scroll-hint kbd{
    display:inline-block;padding:2px 6px;margin:0 3px;
    background:rgba(34,211,238,0.15);color:var(--cyan);
    border:1px solid var(--line-strong);border-radius:4px;
    font-family:var(--mono);font-size:11px;
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="atmos">
  <div class="grid"></div>
  <div class="scan"></div>
</div>

<div class="hud-status">
  <div class="live-dot"></div>
  <div class="live-txt">LIVE</div>
  <div class="live-sub" id="live-sub">Loading signals…</div>
</div>

<div class="hud-filters">
  <div class="filters-title">Filter by category</div>
  <div class="filters-row" id="filters-row"></div>
</div>

<div class="hud-legend">
  <div class="lg-title">Signal Categories</div>
  <div class="lg-row"><span class="lg-swatch" style="background:#A855F7;color:#A855F7"></span>Land in Play</div>
  <div class="lg-row"><span class="lg-swatch" style="background:#F59E0B;color:#F59E0B"></span>In Approvals</div>
  <div class="lg-row"><span class="lg-swatch" style="background:#3B82F6;color:#3B82F6"></span>Pre-Construction</div>
  <div class="lg-row"><span class="lg-swatch" style="background:#10B981;color:#10B981"></span>Under Construction</div>
  <div class="lg-row"><span class="lg-swatch" style="background:#F43F5E;color:#F43F5E"></span>Capital Repositioning</div>
</div>

<div class="scroll-hint" id="scroll-hint">
  Hold <kbd>Shift</kbd> + scroll to zoom
</div>

<script>
const CAT_COLORS = {
  "Land in Play": "#A855F7",
  "In Approvals": "#F59E0B",
  "Pre-Construction": "#3B82F6",
  "Under Construction": "#10B981",
  "Capital Repositioning": "#F43F5E"
};

// ---------- MAP INIT ----------
// All interaction ON. Scroll-wheel zoom gated behind Shift so embedding the
// map inside a scrolling page (ghost post, homepage section) doesn't hijack.
const map = L.map('map', {
  zoomControl: false,
  attributionControl: false,
  dragging: true,
  scrollWheelZoom: false,
  doubleClickZoom: true,
  boxZoom: true,
  touchZoom: true,
  keyboard: true,
  tap: true
}).setView([26.15, -80.14], 11);

L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, subdomains: 'abcd'
}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, subdomains: 'abcd', opacity: 0.78, pane: 'overlayPane'
}).addTo(map);

// ---------- SHIFT + SCROLL ZOOM ----------
const mapEl = document.getElementById('map');
const hint = document.getElementById('scroll-hint');
let hintTimer = null;
let hintShown = false;
mapEl.addEventListener('wheel', (e) => {
  if (e.shiftKey) {
    if (!map.scrollWheelZoom.enabled()) map.scrollWheelZoom.enable();
  } else {
    if (map.scrollWheelZoom.enabled()) map.scrollWheelZoom.disable();
    if (!hintShown) {
      hint.classList.add('show');
      hintShown = true;
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hint.classList.remove('show'), 2600);
    }
  }
}, { passive: true });

// ---------- FALLBACK SIGNALS ----------
const FALLBACK_SIGNALS = [
  { id: "sig_lasolas_01", project_name: "401 Las Olas 14th Floor Buildout", address: "401 E Las Olas Blvd", city: "Fort Lauderdale", latitude: 26.1195, longitude: -80.1390, category: "Under Construction", status_label: "Advance", signal_strength: "High", signal_type: "Interior Fit-Out", value_label: "$218K", permit_number: "ELE-GEN-26030330", owner: "LSREF7 401 Propco LLC", summary: "Five electrical permits and related fire permits filed for a coordinated 14th-floor interior-upgrade package." },
  { id: "sig_vicpark_01", project_name: "Victoria Park 8-Unit Townhouse Project", address: "842-844 NE 19 Way", city: "Fort Lauderdale", latitude: 26.1260, longitude: -80.1300, category: "Under Construction", status_label: "Advance", signal_strength: "High", signal_type: "Active Build / Unit-Level", value_label: "$240K", permit_number: "BLD-GEN-26020522", owner: "Duke at 837 NE 20th Avenue LLC", summary: "Master structural permit and multiple unit-level trade permits active for an 8-townhouse infill development." },
  { id: "sig_ne42_01", project_name: "3080 NE 42 St Waterfront Rebuild", address: "3080 NE 42 St", city: "Fort Lauderdale", latitude: 26.1750, longitude: -80.1050, category: "Under Construction", status_label: "Advance", signal_strength: "High", signal_type: "New Construction", value_label: "$957K", permit_number: "BLD-GEN-26030157", owner: "Visionary Residence LLC", summary: "Demolition and marine permits issued, master permit filed for a new 3-story luxury single-family residence." },
  { id: "sig_01", project_name: "Gore Building Redevelopment", address: "201 W Broward Blvd", city: "Fort Lauderdale", latitude: 26.1215, longitude: -80.1472, category: "Pre-Construction", status_label: "Advance", signal_strength: "High", value_label: "$2.0M", permit_number: "BLD-GEN-26030461", summary: "Demolition efforts for the 92,000 SF county administrative facility have moved into active building department review." },
  { id: "sig_02", project_name: "1400 Progresso Storage", address: "1400 Progresso Dr", city: "Fort Lauderdale", latitude: 26.1360, longitude: -80.1450, category: "Pre-Construction", status_label: "Advance", signal_strength: "High", value_label: "$6.5M", permit_number: "PL-26-0045", summary: "A 147k SF self-storage development has cleared a six-permit execution hurdle in the Progresso district." },
  { id: "sig_10", project_name: "RISE Tower", address: "1101 N Federal Hwy", city: "Fort Lauderdale", latitude: 26.1385, longitude: -80.1215, category: "Under Construction", status_label: "Advance", signal_strength: "High", value_label: "$45.0M", summary: "25-story vertical construction officially mobilized." },

// ---------- DATA LOADING ----------
// Try signals.json first (so the Python pipeline can keep the map fresh).
// Fall back to embedded data if no file is hosted alongside.
async function loadSignals() {
  try {
    const r = await fetch('./signals.json', { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (Array.isArray(j) && j.length) return j;
      if (j && Array.isArray(j.signals) && j.signals.length) return j.signals;
    }
  } catch (e) { /* fall through */ }
  return FALLBACK_SIGNALS;
}

// ---------- MARKER RENDERING ----------
const markersByCategory = {};
let allBounds = null;

function deDupeCoords(signals) {
  const coordMap = new Set();
  signals.forEach(s => {
    let coordKey = `${s.latitude},${s.longitude}`;
    while (coordMap.has(coordKey)) {
      s.latitude += (Math.random() - 0.5) * 0.001;
      s.longitude += (Math.random() - 0.5) * 0.001;
      coordKey = `${s.latitude},${s.longitude}`;
    }
    coordMap.add(coordKey);
  });
}

function renderSignals(signals) {
  deDupeCoords(signals);
  signals.forEach(s => {
    const color = CAT_COLORS[s.category] || "#94a3b8";
    const priorityClass = (s.signal_strength === 'High') ? ' priority' : '';
    const icon = L.divIcon({
      className: 'custom-marker' + priorityClass,
      html: `
        <div class="marker-halo" style="--c:${color}"></div>
        <div class="marker-ring-static" style="--c:${color}"></div>
        <div class="marker-ring" style="--c:${color}"></div>
        <div class="marker-ring r2" style="--c:${color}"></div>
        <div class="marker-core" style="--c:${color}"></div>
      `,
      iconSize: [48, 48],
      iconAnchor: [24, 24]
    });
    const mk = L.marker([s.latitude, s.longitude], { icon: icon }).addTo(map);

    let bodyHtml = '';
    if (s.address || s.city) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Address</span><span class="pop-val">${[s.address, s.city].filter(Boolean).join(', ')}</span></div>`;
    if (s.owner) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Owner</span><span class="pop-val">${s.owner}</span></div>`;
    if (s.signal_type) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Type</span><span class="pop-val">${s.signal_type}</span></div>`;
    if (s.permit_number) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Permit #</span><span class="pop-val mono">${s.permit_number}</span></div>`;
    if (s.value_label) bodyHtml += `<div class="pop-row"><span class="pop-lbl">Value</span><span class="pop-val highlight" style="--c:${color}">${s.value_label}</span></div>`;
    if (s.summary) bodyHtml += `<div class="pop-summary" style="--c:${color}"><strong>Signal:</strong> ${s.summary}</div>`;

    const strengthChip = s.signal_strength ? `<div class="pop-badge ghost">${s.signal_strength} Strength</div>` : '';
    const statusChip = s.status_label ? `<div class="pop-badge ghost">${s.status_label}</div>` : '';

    mk.bindPopup(`
      <div class="pop-header" style="--c:${color}">
        <div class="pop-meta"><span class="dot"></span> ${s.id} &bull; Signal Report</div>
        <div class="pop-title">${s.project_name}</div>
        <div class="pop-chips">
          <div class="pop-badge" style="--c:${color}">${s.category}</div>
          ${strengthChip}
          ${statusChip}
        </div>
      </div>
      <div class="pop-body">${bodyHtml}</div>
    `, { autoPan: true, maxWidth: 340, className: 'fs-popup' });

    if (!markersByCategory[s.category]) markersByCategory[s.category] = [];
    markersByCategory[s.category].push(mk);

    const ll = L.latLng(s.latitude, s.longitude);
    allBounds = allBounds ? allBounds.extend(ll) : L.latLngBounds(ll, ll);
  });

  if (allBounds && allBounds.isValid()) {
    map.fitBounds(allBounds, { padding: [70, 70], maxZoom: 13 });
  }
}

// ---------- CATEGORY FILTERS ----------
function buildFilters() {
  const row = document.getElementById('filters-row');
  row.innerHTML = '';
  Object.keys(CAT_COLORS).forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'f-chip';
    chip.dataset.category = cat;
    chip.style.setProperty('--c', CAT_COLORS[cat]);
    chip.innerHTML = `<span class="dot"></span>${cat}`;
    chip.addEventListener('click', () => {
      chip.classList.toggle('off');
      const off = chip.classList.contains('off');
      (markersByCategory[cat] || []).forEach(m => {
        if (off) map.removeLayer(m); else m.addTo(map);
      });
    });
    row.appendChild(chip);
  });
}

// ---------- LIVE STATUS ----------
function updateLiveStatus(count) {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('live-sub').textContent =
    `${count} signals • updated ${hh}:${mm}`;
}

// ---------- BOOT ----------
(async function () {
  const signals = await loadSignals();
  renderSignals(signals);
  buildFilters();
  updateLiveStatus(signals.length);
  setTimeout(() => map.invalidateSize(), 200);
})();
</script>
